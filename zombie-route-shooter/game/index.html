<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Zombie Route">
<title>Zombie Route Shooter</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<!-- Classic scripts (not ES modules) so the game also runs from file:// -->
<script src="js/config.js"></script>
<script src="js/render/camera.js"></script>
<script src="js/render/sprites.js"></script>
<script src="js/render/road.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/entities/bullets.js"></script>
<script src="js/entities/gates.js"></script>
<script src="js/entities/barrels.js"></script>
<script src="js/entities/zombies.js"></script>
<script src="js/entities/boss.js"></script>
<script src="js/entities/squad.js"></script>
<script src="js/levels.js"></script>
<script src="js/save.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
<script>
// Offline support when served over http(s); skipped for file:// and the single-file build.
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () { /* offline install unavailable here */ });
  });
}
</script>
</body>
</html>
